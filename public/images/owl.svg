<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" width="300" height="460" fill="none">
  <!-- Watercolor owl. Groups have ids/classes for animation:
       #wing-left / #wing-right (pivot at shoulder), #eyes (blink: scaleY), #ear-left / #ear-right,
       #head (face+ears+speckles), #feet. Tip: use `transform-box: fill-box` in CSS. -->
  <defs>
    <linearGradient id="owl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d9ca2"/>
      <stop offset="0.38" stop-color="#8eaaad"/>
      <stop offset="0.52" stop-color="#cdd2c6"/>
      <stop offset="0.64" stop-color="#f2e6d1"/>
      <stop offset="0.85" stop-color="#fbf6ee"/>
      <stop offset="1" stop-color="#f7efe3"/>
    </linearGradient>
    <linearGradient id="owl-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3a593"/>
      <stop offset="0.5" stop-color="#c0b3a2"/>
      <stop offset="1" stop-color="#cdc2b2"/>
    </linearGradient>
    <radialGradient id="owl-belly" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="owl-paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <clipPath id="owl-body-clip"><path d="M150 22 C215 22 252 35 254 90 C258 160 262 260 258 330 C254 400 210 440 150 440 C90 440 46 400 42 330 C38 260 42 160 46 90 C48 35 85 22 150 22 Z"/></clipPath>
  </defs>

