# docker-compose.yml — LOCAL DEVELOPMENT (Mac)
#
# Only runs Postgres. Next.js runs on the host via `npm run dev`,
# using DATABASE_URI=...@localhost:5432/... from .env (see .env.example).
#
#   docker compose up -d
#   npm run dev

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Exposed for npm run dev and DB tools (TablePlus, psql, ...); bound to localhost only
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
